services:
  - type: web
    name: price-intel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: price-intel-db
          property: connectionString
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.ebay.com
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: ^chrome-extension://[a-zA-Z0-9_-]+$
      - key: EBAY_REQUEST_TIMEOUT
        value: "15"
      - key: HTTP_REQUEST_TIMEOUT
        value: "10"

  - type: cron
    name: price-intel-daily-market-refresh
    runtime: python
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jobs.market_refresh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: price-intel-db
          property: connectionString
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_REQUEST_TIMEOUT
        value: "15"
      - key: HTTP_REQUEST_TIMEOUT
        value: "10"

databases:
  - name: price-intel-db
    databaseName: price_intel
    user: price_intel
    plan: free
