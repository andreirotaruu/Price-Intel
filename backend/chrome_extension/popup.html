<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, sans-serif;
      font-size: 13px;
      padding: 12px;
      margin: 0;
      color: #1a1a1a;
    }
    h2 { margin: 0 0 10px; font-size: 15px; }
    .product-title {
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
    .stat:last-child { border-bottom: none; }
    .label { color: #666; }
    .value { font-weight: 500; }
    .value.good { color: #16a34a; }
    .value.bad  { color: #dc2626; }
    .value.neutral { color: #888; }
    #status { color: #888; font-style: italic; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Price Intel</h2>
  <div id="content">
    <div id="status">Loading...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
